extends: configs/sft.yaml
model:
  adapter: outputs/sft/final
training:
  output_dir: outputs/grpo
  num_train_epochs: 1
  eval_steps: 170
  save_steps: 170
  learning_rate: 0.000005
  gradient_accumulation_steps: 4
  eval_strategy: steps
  predict_with_generate: true
  load_best_model_at_end: true
  metric_for_best_model: rewards/MMCQABERTScore/mean
  greater_is_better: true
  num_generations: 4
  max_prompt_length: null
  max_completion_length: 256
  temperature: 0.8
  top_p: 0.95
  beta: 0.0
  loss_type: dr_grpo
  mask_truncated_completions: true
  use_vllm: true
  vllm_mode: colocate
  vllm_enable_lora: true
  vllm_gpu_memory_utilization: 0.45
  vllm_max_model_len: 2048
  vllm_max_num_seqs: 4
  vllm_enable_prefix_caching: true
  vllm_limit_mm_per_prompt: {image: 1, video: 0}
  sleep_level: 1
  offload_model: false
  offload_optimizer: false
reward:
  type: mmbert
  model: jhu-clsp/mmBERT-base
  revision: c5955035435e2bf121cde7f3c8863ef52ff35d82
  num_layers: 17
  device: cuda
  dtype: float16
  batch_size: 4
