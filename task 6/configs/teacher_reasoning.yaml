extends: configs/sft.yaml
prompt_file: prompts/teacher_reasoning.txt
system_prompt: You are a cultural expert helping people understand images and answer questions accurately with culturally grounded knowledge.
teacher:
  name: Qwen/Qwen3-VL-8B-Thinking-FP8
  revision: main  # resolved to an immutable Hub commit on first run; reused on resume
  output_dir: outputs/reasoning/cultural_teacher01
  limit: null  # all TRAIN rows; otherwise random sample without replacement, seeded below
  batch_size: 8
  max_num_seqs: 4
  max_model_len: 8192
  max_new_tokens: 4096
  gpu_memory_utilization: 0.85
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  attempts: 2
  seed: 42
