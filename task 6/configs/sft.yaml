model:
  name: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  adapter: null
  adapter_revision: null
  processor: null
  dtype: bfloat16
  load_in_4bit: false
  attn_implementation: sdpa
  min_pixels: 65536
  max_pixels: 262144
data:
  manifest_dir: data/prepared
  train_split: train
  eval_split: validation
  limit: null
prompt_file: prompts/qa.txt
system_prompt: You are a visual question answering assistant with expertise in cultures worldwide.
peft:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: 'model.language_model.layers.*\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))'
  train_projector: false  # optional LoRA on Qwen3-VL merger + DeepStack mergers; keep ViT frozen
training:
  eval_on_start: true
  output_dir: outputs/runs/experiment03/sft
  num_train_epochs: 1.2
  learning_rate: 0.0002
  label_smoothing_factor: 0.005
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  optim: adamw_torch_fused
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 125
  save_steps: 225
  save_total_limit: null  # retain every checkpoint for post-training merged-model selection
  load_best_model_at_end: false
  metric_for_best_model: eval_loss
  greater_is_better: false
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  report_to: none
  seed: 42
  predict_with_generate: false
  acc_strategy: token
monitor:
  backend: transformers  # loss/token accuracy only; no vLLM or scorer during training
  model: jhu-clsp/mmBERT-base
  revision: c5955035435e2bf121cde7f3c8863ef52ff35d82
  num_layers: 17
  device: cuda
  dtype: float16
  batch_size: 4
  limit: null  # use the full validation set for teacher-forced loss/token accuracy
  max_new_tokens: 256
swift: {}  # optional native ms-swift TrainArguments/RLHFArguments overrides
resume_from_checkpoint: null
